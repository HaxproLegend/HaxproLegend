<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Aranya Datta — Built with curiosity</title>
  <desc id="desc">A brushed aluminum inspired banner with fine horizontal lines and a precise circular technical motif.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset=".35" stop-color="#d9dcdf"/>
      <stop offset=".68" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#c6cbd0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#87909a" stop-opacity=".10"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1.5h4" stroke="#fff" stroke-opacity=".32"/>
      <path d="M0 3.5h4" stroke="#7c8791" stroke-opacity=".10"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#metal)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grain)"/>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="#fff" stroke-opacity=".8"/>
  <path d="M46 54h1108M46 286h1108" stroke="#fff" stroke-opacity=".7"/>
  <path d="M46 56h1108M46 288h1108" stroke="#8f989f" stroke-opacity=".25"/>
  <g fill="#414950" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="101" font-size="13" letter-spacing="4" opacity=".72">PERSONAL BUILD LOG　/　2026</text>
    <text x="70" y="188" font-size="58" font-weight="600" letter-spacing="-2">ARANYA DATTA</text>
    <text x="74" y="226" font-size="17" letter-spacing="2" opacity=".78">SOFTWARE　·　HARDWARE　·　VISUAL DESIGN</text>
    <text x="74" y="264" font-size="12" letter-spacing="3" opacity=".6">DELHI, INDIA</text>
  </g>
  <g transform="translate(1000 170)" fill="none" stroke="#68727b">
    <circle r="76" stroke-opacity=".25"/>
    <circle r="61" stroke-opacity=".42"/>
    <circle r="45" stroke-opacity=".28" stroke-dasharray="1 5"/>
    <path d="M-92 0h184M0-92v184" stroke-opacity=".2"/>
    <path d="M-44 0a44 44 0 0 1 44-44" stroke="#fff" stroke-width="3" stroke-opacity=".75"/>
    <circle r="4" fill="#68727b" stroke="none"/>
  </g>
  <text x="1093" y="274" fill="#414950" opacity=".58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" letter-spacing="2">FIG. 01</text>
